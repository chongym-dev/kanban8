<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IT PMO – Project Board</title>
<style>
/* ===== Design tokens: palette + spacing scale ===== */
:root {
  --blue-900: #0a2540;
  --blue-800: #0d3560;
  --blue-700: #134a86;
  --blue-600: #1a5fb4;
  --blue-500: #2f7bd6;
  --blue-100: #dce9f8;
  --blue-50:  #eef4fb;
  --ink: #17202c;
  --ink-soft: #4a5768;
  --line: #d3dce8;
  --surface: #ffffff;
  --bg: #f2f5f9;
  --red: #c62828;
  --red-bg: #fdecec;
  --amber: #d98a00;
  --amber-bg: #fff4dc;
  --grey: #7b8794;
  --grey-bg: #eceff2;
  --green: #1b7f46;
  --green-bg: #e3f4ea;

  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 24px;
  --s-6: 32px;
  --radius: 8px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; }
html { font-family: var(--font); color: var(--ink); background: var(--bg); }
body { margin: 0; font-size: 14px; line-height: 1.4; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--blue-500); outline-offset: 2px; }

/* ===== Header ===== */
.app-header {
  background: linear-gradient(180deg, var(--blue-800), var(--blue-900));
  color: #fff;
  padding: var(--s-3) var(--s-5);
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-4);
}
.wordmark { font-size: 20px; font-weight: 800; letter-spacing: .08em; }
.wordmark span { font-weight: 400; letter-spacing: .02em; opacity: .85; margin-left: var(--s-2); }
.summary { display: flex; flex-wrap: wrap; gap: var(--s-2); margin: 0 auto 0 var(--s-4); padding: 0; list-style: none; }
.summary li {
  background: rgba(255,255,255,.12); border-radius: var(--radius);
  padding: var(--s-1) var(--s-3); display: flex; gap: var(--s-2); align-items: baseline;
}
.summary strong { font-size: 18px; }
.summary .summary-overdue { background: var(--red); }
.header-actions { display: flex; align-items: center; gap: var(--s-3); }
.demo-note { font-size: 12px; opacity: .8; }

.btn {
  border: 1px solid transparent; border-radius: var(--radius); padding: var(--s-2) var(--s-4);
  background: var(--blue-600); color: #fff; font-weight: 600; cursor: pointer;
}
.btn:hover { background: var(--blue-700); }
.btn:disabled { opacity: .65; cursor: progress; }
.btn-light { background: #fff; color: var(--blue-800); }
.btn-light:hover { background: var(--blue-100); }
.btn-ghost { background: transparent; color: var(--blue-700); border-color: var(--line); }
.btn-ghost:hover { background: var(--blue-50); }

/* ===== Filter bar ===== */
.filters {
  display: flex; flex-wrap: wrap; align-items: end; gap: var(--s-3);
  padding: var(--s-3) var(--s-5); background: var(--surface); border-bottom: 1px solid var(--line);
}
.filters .field { display: flex; flex-direction: column; gap: var(--s-1); min-width: 170px; }
.filters label { font-size: 12px; font-weight: 600; color: var(--ink-soft); }

input[type="text"], input[type="date"], select, textarea {
  border: 1px solid var(--line); border-radius: 6px; padding: var(--s-2); background: #fff; width: 100%;
}
textarea { resize: vertical; min-height: 80px; }

/* ===== Board ===== */
.board { display: flex; gap: var(--s-4); padding: var(--s-4) var(--s-5) var(--s-6); align-items: flex-start; }
.column {
  flex: 1 1 0; min-width: 0; background: var(--blue-50); border: 2px solid transparent;
  border-radius: var(--radius); padding: var(--s-3); transition: border-color .12s, background .12s;
}
.column.drop-target { border-color: var(--blue-500); background: var(--blue-100); border-style: dashed; }
.column-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--s-3); }
.column-head h2 { margin: 0; font-size: 14px; text-transform: uppercase; letter-spacing: .05em; color: var(--blue-800); }
.column-sub { font-size: 11px; color: var(--ink-soft); margin: -8px 0 var(--s-3); }
.count {
  background: var(--blue-700); color: #fff; border-radius: 999px; min-width: 26px; text-align: center;
  padding: 1px var(--s-2); font-weight: 700; font-size: 12px;
}
.card-list { display: flex; flex-direction: column; gap: var(--s-3); min-height: 60px; }
.empty { color: var(--ink-soft); font-size: 12px; text-align: center; padding: var(--s-4) 0; border: 1px dashed var(--line); border-radius: 6px; }

/* ===== Cards ===== */
.card {
  background: var(--surface); border-radius: 6px; border: 1px solid var(--line); border-left: 6px solid var(--grey);
  padding: var(--s-3); cursor: grab; box-shadow: 0 1px 2px rgba(10,37,64,.08);
}
.card.dragging { opacity: .4; }
.card.p-critical { border-left-color: var(--red); }
.card.p-high     { border-left-color: var(--amber); }
.card.p-medium   { border-left-color: var(--blue-500); }
.card.p-low      { border-left-color: var(--grey); }
.card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--s-2); }
.card-id { font-size: 11px; font-weight: 700; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.card-title { margin: var(--s-1) 0 var(--s-2); font-size: 14px; font-weight: 650; overflow-wrap: anywhere; }
.card-meta { font-size: 12px; color: var(--ink-soft); display: grid; gap: 2px; margin-bottom: var(--s-2); overflow-wrap: anywhere; }
.badges { display: flex; flex-wrap: wrap; gap: var(--s-1); margin-bottom: var(--s-2); }
.pill, .tag, .overdue {
  font-size: 11px; font-weight: 700; border-radius: 999px; padding: 1px var(--s-2); white-space: nowrap;
}
.pill-critical { background: var(--red-bg); color: var(--red); border: 1px solid var(--red); }
.pill-high     { background: var(--amber-bg); color: #8a5a00; border: 1px solid var(--amber); }
.pill-medium   { background: var(--blue-100); color: var(--blue-700); border: 1px solid var(--blue-500); }
.pill-low      { background: var(--grey-bg); color: #4a5560; border: 1px solid var(--grey); }
.tag { background: var(--green-bg); color: var(--green); border: 1px solid transparent; font-weight: 600; }
.overdue { background: var(--red-bg); color: var(--red); border: 1px solid var(--red); }
.card-actions { display: flex; gap: var(--s-2); align-items: center; flex-wrap: wrap; }
.mini {
  border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 2px var(--s-2);
  font-size: 12px; cursor: pointer; color: var(--blue-700); font-weight: 600;
}
.mini:hover { background: var(--blue-50); }
.mini-danger { color: var(--red); }
.mini-danger:hover { background: var(--red-bg); }
.icon-btn {
  border: 0; background: transparent; cursor: pointer; font-size: 18px; line-height: 1; color: var(--ink-soft);
  border-radius: 4px; padding: 0 var(--s-1);
}
.icon-btn:hover { color: var(--red); background: var(--red-bg); }
.move-menu, .confirm-row {
  display: flex; flex-wrap: wrap; gap: var(--s-1); align-items: center; margin-top: var(--s-2);
  padding-top: var(--s-2); border-top: 1px dashed var(--line); font-size: 12px;
}
.confirm-row strong { color: var(--red); margin-right: var(--s-1); }

/* ===== Modal + form ===== */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(10,37,64,.55); display: none;
  align-items: flex-start; justify-content: center; padding: var(--s-5) var(--s-3); overflow-y: auto; z-index: 20;
}
.modal-backdrop.open { display: flex; }
.modal { background: #fff; border-radius: 10px; width: 100%; max-width: 560px; padding: var(--s-5); box-shadow: 0 12px 40px rgba(0,0,0,.3); }
.modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--s-4); }
.modal-head h2 { margin: 0; font-size: 18px; color: var(--blue-800); }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-3) var(--s-4); }
.form-grid .full { grid-column: 1 / -1; }
.form-field label { display: block; font-weight: 600; margin-bottom: var(--s-1); font-size: 13px; }
.req { color: var(--red); }
.hint { font-size: 11px; color: var(--ink-soft); text-align: right; }
.error { color: var(--red); font-size: 12px; margin-top: var(--s-1); min-height: 0; }
.invalid { border-color: var(--red); }
.form-actions { display: flex; justify-content: flex-end; gap: var(--s-2); margin-top: var(--s-4); }

/* ===== Toasts ===== */
.toast-region { position: fixed; bottom: var(--s-4); right: var(--s-4); display: flex; flex-direction: column; gap: var(--s-2); z-index: 30; max-width: calc(100vw - 32px); }
.toast { padding: var(--s-3) var(--s-4); border-radius: var(--radius); color: #fff; box-shadow: 0 4px 16px rgba(0,0,0,.25); background: var(--blue-800); }
.toast-success { background: var(--green); }
.toast-warn { background: #8a5a00; }

/* ===== Responsive: stack columns below 768px ===== */
@media (max-width: 767px) {
  .board { flex-direction: column; align-items: stretch; padding: var(--s-3); }
  .column { flex: none; }
  .app-header, .filters { padding-left: var(--s-3); padding-right: var(--s-3); }
  .summary { margin-left: 0; }
  .form-grid { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { .column { transition: none; } }
</style>
</head>
<body>

<!-- ===== Header: wordmark, live summary strip, add button ===== -->
<header class="app-header">
  <div class="wordmark">IT PMO<span>Project Board</span></div>
  <ul class="summary" id="summary" aria-label="Board summary"></ul>
  <div class="header-actions">
    <span class="demo-note">Demo data – board resets on page refresh.</span>
    <button type="button" class="btn btn-light" id="openAdd">+ Add Task</button>
  </div>
</header>

<!-- ===== Filter bar (client-side only) ===== -->
<section class="filters" aria-label="Filters">
  <div class="field">
    <label for="fProject">Project</label>
    <select id="fProject"></select>
  </div>
  <div class="field">
    <label for="fAssignee">Assignee contains</label>
    <input type="text" id="fAssignee" placeholder="e.g. Tan">
  </div>
  <div class="field">
    <label for="fPriority">Priority</label>
    <select id="fPriority"></select>
  </div>
  <button type="button" class="btn btn-ghost" id="clearFilters">Clear filters</button>
</section>

<!-- ===== Kanban board (rendered by renderBoard()) ===== -->
<main class="board" id="board" aria-label="Kanban board"></main>

<!-- ===== Add Task modal ===== -->
<div class="modal-backdrop" id="modalBackdrop">
  <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head">
      <h2 id="modalTitle">Add Task</h2>
      <button type="button" class="icon-btn" id="closeAdd" aria-label="Close add task form">&times;</button>
    </div>
    <form id="taskForm" novalidate>
      <div class="form-grid">
        <div class="form-field full">
          <label for="title">Task Title <span class="req" aria-hidden="true">*</span></label>
          <input type="text" id="title" name="title" maxlength="80" autocomplete="off" aria-describedby="err-title">
          <div class="error" id="err-title" role="alert"></div>
        </div>
        <div class="form-field full">
          <label for="description">Description</label>
          <textarea id="description" name="description" maxlength="500" aria-describedby="err-description hint-desc"></textarea>
          <div class="hint" id="hint-desc">0 / 500</div>
          <div class="error" id="err-description" role="alert"></div>
        </div>
        <div class="form-field">
          <label for="project">Project / Workstream</label>
          <select id="project" name="project" aria-describedby="err-project"></select>
          <div class="error" id="err-project" role="alert"></div>
        </div>
        <div class="form-field">
          <label for="category">Category</label>
          <select id="category" name="category" aria-describedby="err-category"></select>
          <div class="error" id="err-category" role="alert"></div>
        </div>
        <div class="form-field">
          <label for="assignee">Assignee <span class="req" aria-hidden="true">*</span></label>
          <input type="text" id="assignee" name="assignee" autocomplete="off" aria-describedby="err-assignee">
          <div class="error" id="err-assignee" role="alert"></div>
        </div>
        <div class="form-field">
          <label for="priority">Priority</label>
          <select id="priority" name="priority" aria-describedby="err-priority"></select>
          <div class="error" id="err-priority" role="alert"></div>
        </div>
        <div class="form-field">
          <label for="dueDate">Due Date <span class="req" aria-hidden="true">*</span></label>
          <input type="date" id="dueDate" name="dueDate" aria-describedby="err-dueDate">
          <div class="error" id="err-dueDate" role="alert"></div>
        </div>
        <div class="form-field">
          <label for="status">Status</label>
          <select id="status" name="status" aria-describedby="err-status"></select>
          <div class="error" id="err-status" role="alert"></div>
        </div>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-ghost" id="cancelAdd">Cancel</button>
        <button type="submit" class="btn" id="submitBtn">Add Task</button>
      </div>
    </form>
  </section>
</div>

<!-- Toast region: announced politely to assistive tech -->
<div class="toast-region" id="toasts" aria-live="polite" aria-atomic="false"></div>

<!--
  FormSubmit one-time activation:
  The FIRST submission to a new address makes FormSubmit send a confirmation email to that address.
  Submissions are only delivered after the activation link in that email has been clicked.
  Until then (or while the placeholder address below is unchanged) the request fails or is not
  delivered; the board still works and shows a warning toast.
-->
<script>
"use strict";

/* ===================================================================
   CONFIG – change the email address in this one place.
   =================================================================== */
const FORMSUBMIT_ENDPOINT = "https://formsubmit.co/ajax/YOUR_EMAIL@example.com";
const TASK_ID_PREFIX = "UOB-ITPM-";   // ID format: PREFIX + zero-padded counter
const EMAIL_SUBJECT_TAG = "[UOB IT PMO]";

/* ===================================================================
   Reference data
   =================================================================== */
const STATUSES = [
  { name: "Backlog",     hint: "Logged, not yet scheduled" },
  { name: "In Progress", hint: "Actively being worked" },
  { name: "Blocked",     hint: "Waiting on a dependency, vendor or approval" },
  { name: "Done",        hint: "Completed / closed" }
];
const PROJECTS = ["Core Banking Upgrade", "Digital Channels", "Cybersecurity Uplift", "Data & Analytics", "Infrastructure & Cloud", "Vendor Management"];
const CATEGORIES = ["Application Development", "Infrastructure", "Cybersecurity", "Data", "Compliance", "Vendor"];
const PRIORITIES = ["Critical", "High", "Medium", "Low"];

/* ===================================================================
   State – single source of truth (in memory only, no storage APIs)
   =================================================================== */
const state = {
  tasks: [],
  filters: { project: "", assignee: "", priority: "" },
  confirmingId: null,   // card showing inline "Delete? Yes / No"
  movingId: null        // card showing the keyboard "Move ▸" menu
};
let nextIdNumber = 1;
let draggedId = null;
let pendingFocus = null; // selector to focus after next render

/* ===================================================================
   Helpers
   =================================================================== */
function escapeHtml(value) {
  return String(value == null ? "" : value)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function todayStr() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

function offsetDate(days) {
  const d = new Date();
  d.setDate(d.getDate() + days);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

function formatDate(iso) {
  const p = iso.split("-");
  const d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  return d.toLocaleDateString(undefined, { day: "2-digit", month: "short", year: "numeric" });
}

function generateTaskId() {
  const id = TASK_ID_PREFIX + String(nextIdNumber).padStart(4, "0");
  nextIdNumber += 1;
  return id;
}

function isOverdue(task) {
  return task.status !== "Done" && task.dueDate < todayStr();
}

function optionsHtml(list, placeholder) {
  const first = placeholder ? '<option value="">' + escapeHtml(placeholder) + "</option>" : "";
  return first + list.map(function (v) { return '<option value="' + escapeHtml(v) + '">' + escapeHtml(v) + "</option>"; }).join("");
}

/* ===================================================================
   Seed data (8 demo tasks)
   =================================================================== */
function seedTasks() {
  const seed = [
    ["Migrate FX pricing service to AWS", "Lift-and-shift the FX pricing engine with parallel run.", "Infrastructure & Cloud", "Infrastructure", "Priya Nair", "High", 21, "In Progress"],
    ["Patch CVE-2025-XXXX on branch teller VDI", "Roll out vendor patch to all branch teller VDI pools.", "Cybersecurity Uplift", "Cybersecurity", "Marcus Tan", "Critical", -2, "In Progress"],
    ["UAT sign-off for mobile onboarding release 4.2", "Collect business sign-off on UAT results.", "Digital Channels", "Application Development", "Aisha Rahman", "High", 5, "Blocked"],
    ["Renew core banking vendor support contract", "Negotiate SLA terms ahead of expiry.", "Vendor Management", "Vendor", "Daniel Lim", "Medium", 30, "Backlog"],
    ["Build customer churn data mart", "Curated mart feeding the retention dashboards.", "Data & Analytics", "Data", "Chen Wei", "Medium", 45, "Backlog"],
    ["Quarterly access recertification", "Complete privileged access review for core platforms.", "Cybersecurity Uplift", "Compliance", "Sofia Garcia", "High", -5, "Blocked"],
    ["Decommission legacy batch scheduler", "Retire the old scheduler after cutover to new orchestration.", "Core Banking Upgrade", "Infrastructure", "Ravi Kumar", "Low", -10, "Done"],
    ["Internet banking login page accessibility fixes", "Resolve WCAG 2.1 AA findings from audit.", "Digital Channels", "Application Development", "Hana Ito", "Low", 14, "Done"]
  ];
  return seed.map(function (s) {
    return {
      id: generateTaskId(), title: s[0], description: s[1], project: s[2], category: s[3],
      assignee: s[4], priority: s[5], dueDate: offsetDate(s[6]), status: s[7]
    };
  });
}

/* ===================================================================
   Filtering (pure client-side over state.tasks)
   =================================================================== */
function applyFilters(tasks) {
  const f = state.filters;
  const needle = f.assignee.trim().toLowerCase();
  return tasks.filter(function (t) {
    if (f.project && t.project !== f.project) return false;
    if (f.priority && t.priority !== f.priority) return false;
    if (needle && t.assignee.toLowerCase().indexOf(needle) === -1) return false;
    return true;
  });
}

/* ===================================================================
   Rendering – the only place card contents / counts are written
   =================================================================== */
function renderCard(task) {
  const pKey = task.priority.toLowerCase();
  const id = escapeHtml(task.id);
  const overdue = isOverdue(task) ? '<span class="overdue">Overdue</span>' : "";

  let extra = "";
  if (state.confirmingId === task.id) {
    extra = '<div class="confirm-row"><strong>Delete?</strong>' +
      '<button type="button" class="mini mini-danger" data-action="delete-yes" data-id="' + id + '">Yes</button>' +
      '<button type="button" class="mini" data-action="delete-no" data-id="' + id + '">No</button></div>';
  } else if (state.movingId === task.id) {
    extra = '<div class="move-menu" role="group" aria-label="Move ' + id + ' to">' +
      STATUSES.filter(function (s) { return s.name !== task.status; }).map(function (s) {
        return '<button type="button" class="mini" data-action="move-to" data-id="' + id + '" data-status="' + escapeHtml(s.name) + '">' + escapeHtml(s.name) + "</button>";
      }).join("") + "</div>";
  }

  return '<article class="card p-' + pKey + '" draggable="true" data-id="' + id + '" aria-label="' + id + ": " + escapeHtml(task.title) + '">' +
    '<div class="card-top"><span class="card-id">' + id + "</span>" +
    '<button type="button" class="icon-btn" data-action="delete" data-id="' + id + '" aria-label="Delete task ' + id + '">&times;</button></div>' +
    '<h3 class="card-title">' + escapeHtml(task.title) + "</h3>" +
    '<div class="card-meta"><span>&#9638; ' + escapeHtml(task.project) + "</span>" +
    "<span>&#9786; " + escapeHtml(task.assignee) + "</span>" +
    "<span>&#128197; Due " + escapeHtml(formatDate(task.dueDate)) + "</span></div>" +
    '<div class="badges"><span class="pill pill-' + pKey + '">' + escapeHtml(task.priority) + "</span>" +
    '<span class="tag">' + escapeHtml(task.category) + "</span>" + overdue + "</div>" +
    '<div class="card-actions"><button type="button" class="mini" data-action="move" data-id="' + id + '" aria-expanded="' + (state.movingId === task.id) + '">Move &#9656;</button></div>' +
    extra + "</article>";
}

function renderSummary() {
  const all = state.tasks;
  let html = '<li><strong>' + all.length + "</strong> total</li>";
  STATUSES.forEach(function (s) {
    html += "<li><strong>" + all.filter(function (t) { return t.status === s.name; }).length + "</strong> " + escapeHtml(s.name) + "</li>";
  });
  html += '<li class="summary-overdue"><strong>' + all.filter(isOverdue).length + "</strong> Overdue</li>";
  document.getElementById("summary").innerHTML = html;
}

function renderBoard() {
  const visible = applyFilters(state.tasks);
  const html = STATUSES.map(function (s) {
    const cards = visible.filter(function (t) { return t.status === s.name; });
    return '<section class="column" data-status="' + escapeHtml(s.name) + '" aria-label="' + escapeHtml(s.name) + ' column">' +
      '<div class="column-head"><h2>' + escapeHtml(s.name) + '</h2><span class="count" aria-label="' + cards.length + ' tasks">' + cards.length + "</span></div>" +
      '<p class="column-sub">' + escapeHtml(s.hint) + "</p>" +
      '<div class="card-list">' + (cards.length ? cards.map(renderCard).join("") : '<div class="empty">No tasks</div>') + "</div></section>";
  }).join("");
  document.getElementById("board").innerHTML = html;
  renderSummary();
  if (pendingFocus) {
    const el = document.querySelector(pendingFocus);
    if (el) el.focus();
    pendingFocus = null;
  }
}

/* ===================================================================
   State mutations
   =================================================================== */
function addTask(data) {
  const task = {
    id: generateTaskId(), title: data.title, description: data.description, project: data.project,
    category: data.category, assignee: data.assignee, priority: data.priority,
    dueDate: data.dueDate, status: data.status
  };
  state.tasks.push(task);
  renderBoard();
  return task;
}

function moveTask(id, status) {
  const task = state.tasks.find(function (t) { return t.id === id; });
  if (!task || task.status === status) return;
  task.status = status;
  state.movingId = null;
  pendingFocus = '.card[data-id="' + id + '"] [data-action="move"]';
  renderBoard();
}

function deleteTask(id) {
  state.tasks = state.tasks.filter(function (t) { return t.id !== id; });
  state.confirmingId = null;
  state.movingId = null;
  renderBoard();
}

/* ===================================================================
   FormSubmit notification (never allowed to break the board)
   =================================================================== */
async function notifyNewTask(task) {
  const res = await fetch(FORMSUBMIT_ENDPOINT, {
    method: "POST",
    headers: { "Content-Type": "application/json", Accept: "application/json" },
    body: JSON.stringify({
      _subject: `${EMAIL_SUBJECT_TAG} New task ${task.id}: ${task.title}`,
      _template: "table",
      _captcha: "false",
      "Task ID": task.id,
      Title: task.title,
      Description: task.description,
      Project: task.project,
      Category: task.category,
      Assignee: task.assignee,
      Priority: task.priority,
      "Due Date": task.dueDate,
      Status: task.status,
      "Submitted At": new Date().toISOString()
    })
  });
  if (!res.ok) throw new Error(`FormSubmit failed: ${res.status}`);
  return res.json();
}

/* ===================================================================
   Toasts
   =================================================================== */
function showToast(message, kind) {
  const region = document.getElementById("toasts");
  const el = document.createElement("div");
  el.className = "toast toast-" + (kind || "info");
  el.textContent = message;
  region.appendChild(el);
  setTimeout(function () { el.remove(); }, kind === "warn" ? 6000 : 4000);
}

/* ===================================================================
   Form: read, validate, submit
   =================================================================== */
const form = document.getElementById("taskForm");
const FIELD_NAMES = ["title", "description", "project", "category", "assignee", "priority", "dueDate", "status"];

function readForm() {
  const out = {};
  FIELD_NAMES.forEach(function (n) { out[n] = form.elements[n].value.trim(); });
  return out;
}

function validateForm(d) {
  const errors = {};
  if (!d.title) errors.title = "Task title is required.";
  else if (d.title.length > 80) errors.title = "Title must be 80 characters or fewer.";
  if (d.description.length > 500) errors.description = "Description must be 500 characters or fewer.";
  if (PROJECTS.indexOf(d.project) === -1) errors.project = "Choose a project.";
  if (CATEGORIES.indexOf(d.category) === -1) errors.category = "Choose a category.";
  if (!d.assignee) errors.assignee = "Assignee is required.";
  if (PRIORITIES.indexOf(d.priority) === -1) errors.priority = "Choose a priority.";
  if (!d.dueDate) errors.dueDate = "Due date is required.";
  else if (d.dueDate < todayStr()) errors.dueDate = "Due date cannot be in the past.";
  if (!STATUSES.some(function (s) { return s.name === d.status; })) errors.status = "Choose a status.";
  return errors;
}

function showErrors(errors) {
  FIELD_NAMES.forEach(function (n) {
    const box = document.getElementById("err-" + n);
    box.textContent = errors[n] || "";
    form.elements[n].classList.toggle("invalid", Boolean(errors[n]));
    form.elements[n].setAttribute("aria-invalid", errors[n] ? "true" : "false");
  });
}

function resetForm() {
  form.reset();
  form.elements.priority.value = "Medium";
  form.elements.status.value = "Backlog";
  showErrors({});
  updateDescCounter();
}

function updateDescCounter() {
  document.getElementById("hint-desc").textContent = form.elements.description.value.length + " / 500";
}

async function handleSubmit(event) {
  event.preventDefault();
  const data = readForm();
  const errors = validateForm(data);
  showErrors(errors);
  const firstBad = FIELD_NAMES.find(function (n) { return errors[n]; });
  if (firstBad) { form.elements[firstBad].focus(); return; }

  const btn = document.getElementById("submitBtn");
  btn.disabled = true;
  btn.textContent = "Sending…";

  // Optimistic UI: card appears immediately, network call runs in parallel.
  const task = addTask(data);
  resetForm();

  try {
    await notifyNewTask(task);
    showToast("Task " + task.id + " added and notification sent.", "success");
  } catch (err) {
    showToast("Card added locally — email notification failed", "warn");
  } finally {
    btn.disabled = false;
    btn.textContent = "Add Task";
    closeModal();
  }
}

/* ===================================================================
   Modal open/close with simple focus handling
   =================================================================== */
const backdrop = document.getElementById("modalBackdrop");
let lastFocused = null;

function openModal() {
  lastFocused = document.activeElement;
  form.elements.dueDate.min = todayStr();
  backdrop.classList.add("open");
  form.elements.title.focus();
}

function closeModal() {
  backdrop.classList.remove("open");
  if (lastFocused && lastFocused.focus) lastFocused.focus();
}

function trapFocus(event) {
  if (event.key === "Escape" && backdrop.classList.contains("open")) { closeModal(); return; }
  if (event.key !== "Tab" || !backdrop.classList.contains("open")) return;
  const items = backdrop.querySelectorAll("button:not(:disabled), input, select, textarea");
  if (!items.length) return;
  const first = items[0], last = items[items.length - 1];
  if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
  else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
}

/* ===================================================================
   Event wiring: board (delegated), drag & drop, filters, form
   =================================================================== */
function onBoardClick(event) {
  const btn = event.target.closest("[data-action]");
  if (!btn) return;
  const id = btn.getAttribute("data-id");
  const action = btn.getAttribute("data-action");
  if (action === "delete") {
    state.confirmingId = id; state.movingId = null;
    pendingFocus = '.card[data-id="' + id + '"] [data-action="delete-no"]';
    renderBoard();
  } else if (action === "delete-yes") {
    deleteTask(id);
  } else if (action === "delete-no") {
    state.confirmingId = null;
    pendingFocus = '.card[data-id="' + id + '"] [data-action="delete"]';
    renderBoard();
  } else if (action === "move") {
    state.movingId = state.movingId === id ? null : id;
    state.confirmingId = null;
    pendingFocus = state.movingId ? '.card[data-id="' + id + '"] [data-action="move-to"]' : '.card[data-id="' + id + '"] [data-action="move"]';
    renderBoard();
  } else if (action === "move-to") {
    moveTask(id, btn.getAttribute("data-status"));
  }
}

function clearDropHighlights() {
  document.querySelectorAll(".column.drop-target").forEach(function (c) { c.classList.remove("drop-target"); });
}

function onDragStart(event) {
  const card = event.target.closest && event.target.closest(".card");
  if (!card) return;
  draggedId = card.getAttribute("data-id");
  event.dataTransfer.effectAllowed = "move";
  event.dataTransfer.setData("text/plain", draggedId);
  card.classList.add("dragging");
}

function onDragOver(event) {
  const col = event.target.closest(".column");
  if (!col || !draggedId) return;
  event.preventDefault();
  event.dataTransfer.dropEffect = "move";
  if (!col.classList.contains("drop-target")) { clearDropHighlights(); col.classList.add("drop-target"); }
}

function onDragLeave(event) {
  const col = event.target.closest(".column");
  if (col && !col.contains(event.relatedTarget)) col.classList.remove("drop-target");
}

function onDrop(event) {
  const col = event.target.closest(".column");
  if (!col || !draggedId) return;
  event.preventDefault();
  const id = draggedId;
  draggedId = null;
  clearDropHighlights();
  moveTask(id, col.getAttribute("data-status"));
}

function onDragEnd() {
  draggedId = null;
  clearDropHighlights();
  document.querySelectorAll(".card.dragging").forEach(function (c) { c.classList.remove("dragging"); });
}

function onFilterChange() {
  state.filters.project = document.getElementById("fProject").value;
  state.filters.priority = document.getElementById("fPriority").value;
  state.filters.assignee = document.getElementById("fAssignee").value;
  renderBoard();
}

function clearFilters() {
  document.getElementById("fProject").value = "";
  document.getElementById("fPriority").value = "";
  document.getElementById("fAssignee").value = "";
  onFilterChange();
}

/* ===================================================================
   Init
   =================================================================== */
function init() {
  document.getElementById("fProject").innerHTML = optionsHtml(PROJECTS, "All projects");
  document.getElementById("fPriority").innerHTML = optionsHtml(PRIORITIES, "All priorities");
  form.elements.project.innerHTML = optionsHtml(PROJECTS);
  form.elements.category.innerHTML = optionsHtml(CATEGORIES);
  form.elements.priority.innerHTML = optionsHtml(PRIORITIES);
  form.elements.status.innerHTML = optionsHtml(STATUSES.map(function (s) { return s.name; }));
  resetForm();

  state.tasks = seedTasks();
  renderBoard();

  const board = document.getElementById("board");
  board.addEventListener("click", onBoardClick);
  board.addEventListener("dragstart", onDragStart);
  board.addEventListener("dragover", onDragOver);
  board.addEventListener("dragleave", onDragLeave);
  board.addEventListener("drop", onDrop);
  board.addEventListener("dragend", onDragEnd);

  ["fProject", "fPriority"].forEach(function (id) { document.getElementById(id).addEventListener("change", onFilterChange); });
  document.getElementById("fAssignee").addEventListener("input", onFilterChange);
  document.getElementById("clearFilters").addEventListener("click", clearFilters);

  document.getElementById("openAdd").addEventListener("click", openModal);
  document.getElementById("closeAdd").addEventListener("click", closeModal);
  document.getElementById("cancelAdd").addEventListener("click", closeModal);
  backdrop.addEventListener("mousedown", function (e) { if (e.target === backdrop) closeModal(); });
  document.addEventListener("keydown", trapFocus);
  form.addEventListener("submit", handleSubmit);
  form.elements.description.addEventListener("input", updateDescCounter);
}

init();
</script>
</body>
</html>
